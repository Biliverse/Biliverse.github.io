<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>Biliverse</title>
    <link rel="stylesheet" href="https://s1.hdslb.com/bfs/static/2233-monorepo/customer-service-h5/static/css/index.545c1c91.css">
    <link rel="stylesheet" href="/settings/home.css?v=0.9.1">
    <link rel="stylesheet" href="/settings/theme.css?v=0.9.1">
  </head>
  <body>
    <header id="app-navbar" class="home-navbar"><button type="button" aria-label="返回">‹</button><div class="pp-brand"><picture class="pp-brand-icon"><source media="(prefers-color-scheme: dark)" srcset="/settings/assets/Biliverse_subject_dark.png"><img src="/settings/assets/Biliverse_subject_light.png" alt="Biliverse"></picture><h1>Biliverse</h1></div><span class="home-nav-spacer"></span></header>
    <div id="pages">
    <main class="biliverse-home">
      <picture class="brand-logo"><source media="(prefers-color-scheme: dark)" srcset="/settings/assets/Biliverse_subject_dark.png"><img src="/settings/assets/Biliverse_subject_light.png" alt=""></picture>
      <section class="self-panel is-zh">
        <h2 class="header">插件</h2>
        <div class="container"><div class="scroll-view"><div class="scroll">
          <button class="self-item is-zh" data-module="Enhanced" data-page="/settings/Enhanced" disabled><picture class="logo"><source media="(prefers-color-scheme: dark)" srcset="/settings/assets/Enhanced_subject_dark.png"><img src="/settings/assets/Enhanced_subject_light.png" alt=""></picture><span class="name">Enhanced</span><span class="module-status">检测中</span></button>
          <button class="self-item is-zh" data-module="Global" data-page="/settings/Global" disabled><picture class="logo"><source media="(prefers-color-scheme: dark)" srcset="/settings/assets/Global_subject_dark.png"><img src="/settings/assets/Global_subject_light.png" alt=""></picture><span class="name">Global</span><span class="module-status">检测中</span></button>
          <button class="self-item is-zh" data-module="Redirect" data-page="/settings/Redirect" disabled><picture class="logo"><source media="(prefers-color-scheme: dark)" srcset="/settings/assets/Redirect_subject_dark.png"><img src="/settings/assets/Redirect_subject_light.png" alt=""></picture><span class="name">Redirect</span><span class="module-status">检测中</span></button>
          <button class="self-item is-zh" data-module="ADBlock" data-page="/settings/ADBlock" disabled><picture class="logo"><source media="(prefers-color-scheme: dark)" srcset="/settings/assets/ADBlock_subject_dark.png"><img src="/settings/assets/ADBlock_subject_light.png" alt=""></picture><span class="name">ADBlock</span><span class="module-status">检测中</span></button>
        </div></div></div>
      </section>
      <p class="settings-note">设置保存在当前代理工具中。使用本地设置前，请将配置类型设为 PersistentStore。</p>
      <footer class="settings-build" id="build-info">本地预览（未构建）</footer>
      <p class="settings-build"><button id="export-capabilities" type="button" hidden>复制客户端能力</button><span id="export-status" role="status"></span></p>
    </main>
    </div>
    <template id="module-template"><section id="module-host">
      <div class="module-message"><button type="button">返回</button><p role="status"></p></div>
    </section></template>
    <script src="https://s1.hdslb.com/bfs/seed/jinkela/short/jsb/js-bridge.min.js" defer></script>
    <script type="module" src="/settings/home.js?v=0.9.1"></script>
  </body>
</html>
