<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>Biliverse</title>
    <link rel="stylesheet" href="https://s1.hdslb.com/bfs/seed/jinkela/short/b-style/theme.min.css">
    <link rel="stylesheet" href="https://s1.hdslb.com/bfs/static/2233-monorepo/customer-service-h5/static/css/index.545c1c91.css">
    <link rel="stylesheet" href="https://biliverse.github.io/settings/theme.css?v=0.9.9">
  </head>
  <body>

    <div id="pages" data-preference-panes-pages>
    <main class="biliverse-home customer-service" data-preference-panes-home>
      <div class="customer-service-main">
      <img class="brand-logo" src="/settings/assets/Biliverse_subject.png" alt="">
      <section class="self-panel is-zh">
        <h2 class="header">插件</h2>
        <div class="container"><div class="scroll-view multi-layout multi-single"><div class="scroll">
          <button class="self-item is-zh" data-module="Enhanced" data-page="/settings/Enhanced" data-json="/configs/Enhanced" data-css="https://biliverse.github.io/settings/theme.css?v=0.9.9" disabled><span class="logo"><img src="/settings/assets/Enhanced_subject.png" alt=""></span><span class="name">Enhanced</span><span class="module-status" data-module-status>检测中</span></button>
          <button class="self-item is-zh" data-module="Global" data-page="/settings/Global" data-json="/configs/Global" data-css="https://biliverse.github.io/settings/theme.css?v=0.9.9" disabled><span class="logo"><img src="/settings/assets/Global_subject.png" alt=""></span><span class="name">Global</span><span class="module-status" data-module-status>检测中</span></button>
          <button class="self-item is-zh" data-module="Redirect" data-page="/settings/Redirect" data-json="/configs/Redirect" data-css="https://biliverse.github.io/settings/theme.css?v=0.9.9" disabled><span class="logo"><img src="/settings/assets/Redirect_subject.png" alt=""></span><span class="name">Redirect</span><span class="module-status" data-module-status>检测中</span></button>
          <button class="self-item is-zh" data-module="ADBlock" data-page="/settings/ADBlock" data-json="/configs/ADBlock" data-css="https://biliverse.github.io/settings/theme.css?v=0.9.9" disabled><span class="logo"><img src="/settings/assets/ADBlock_subject.png" alt=""></span><span class="name">ADBlock</span><span class="module-status" data-module-status>检测中</span></button>
        </div></div></div>
      </section>
      </div>
      <footer class="footer-hint is-overseas">
        <div class="hint-content">
          <p class="customer-time">设置保存在当前代理工具中。使用本地设置前，请将配置类型设为 PersistentStore。</p>
          <p class="customer-mail" id="build-info">本地预览（未构建）</p>
        </div>
      </footer>
    </main>
    </div>
    <template data-preference-panes-module><section id="module-host"><p class="module-message" data-module-message>正在打开设置…</p></section></template>
    <script src="https://s1.hdslb.com/bfs/seed/jinkela/short/jsb/js-bridge.min.js"></script>
    <script type="module" src="/settings/index.mjs"></script>
  </body>
</html>
